<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Pribadi - Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <div class="logo">MyProfile</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Hubungi Saya</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label for="category">Kategori / Keperluan</label>
          <select id="category" name="category" required>
            <option value="">-- Pilih Keperluan --</option>
            <option value="konsultasi">Konsultasi</option>
            <option value="kolaborasi">Kolaborasi Proyek</option>
            <option value="umum">Pertanyaan Umum</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" name="message" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; lila 2026. Tugas Praktikum Lab Minggu 1.</p>
  </footer>

</body>
</html>
